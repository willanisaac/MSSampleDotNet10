apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-api
  namespace: default
  labels:
    app: bff-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bff-api
  template:
    metadata:
      labels:
        app: bff-api
    spec:
      containers:
      - name: bff-api
        image: bff-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: GraphQLServices__UsersServiceUrl
          valueFrom:
            configMapKeyRef:
              name: bff-config
              key: users-service-url
        - name: GraphQLServices__OrdersServiceUrl
          valueFrom:
            configMapKeyRef:
              name: bff-config
              key: orders-service-url
        - name: GraphQLServices__PaymentsServiceUrl
          valueFrom:
            configMapKeyRef:
              name: bff-config
              key: payments-service-url
        - name: GraphQLServices__TimeoutSeconds
          value: "30"
        - name: GraphQLServices__RetryCount
          value: "3"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
